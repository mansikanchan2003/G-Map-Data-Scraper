# Is AutoGMap up? Checked from GitHub every 5 minutes (scripts/uptime_check.py),
# because a server that is down cannot say so itself. Emails ALERT_TO when it goes
# down, every 2 hours while it stays down, and when it is back.
#
# Secrets (Settings -> Secrets and variables -> Actions), the same email settings
# as the server's .env: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM,
# and ALERT_TO (who is told).
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # the last state is kept in the Actions cache between runs

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime_check.py
          sparse-checkout-cone-mode: false

      - name: Last state
        uses: actions/cache/restore@v4
        with:
          path: uptime_state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check and alert
        id: check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          pip install --quiet requests
          python scripts/uptime_check.py --url https://indev.eko.in/autogmap/health --state uptime_state.json

      - name: Keep the state
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: uptime_state.json
          key: uptime-state-${{ github.run_id }}
