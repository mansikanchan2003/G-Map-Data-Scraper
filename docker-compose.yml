# =============================================================================
# G-Map Data Scraper 2.0 — Docker Compose
# Services: backend, postgres, n8n
#
# USAGE:
#   1. Copy .env.example to .env and fill in all required values.
#   2. docker compose up -d
#   3. docker compose exec backend alembic upgrade head
#   4. Verify: curl http://localhost:8000/health
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — production database
  # Data persisted in a named volume (not the container filesystem).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmap_scraper}
      POSTGRES_USER: ${POSTGRES_USER:-gmap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost only. A database on 0.0.0.0 is reachable from
      # anywhere the host is.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmap_user} -d ${POSTGRES_DB:-gmap_scraper}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + Playwright
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The public sub-path the UI is served under. Baked in at build time
        # because Vite rewrites every asset URL with it.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    environment:
      # Database — point to the postgres service above
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gmap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gmap_scraper}

      # API settings
      API_HOST: "0.0.0.0"
      API_PORT: "8000"

      # CORS — set to your actual frontend origin in production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      # Backend URL (used by n8n and for internal references)
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}

      # Discovery settings
      # Timings tuned from measured job profiles: detail-page fetching is ~78%
      # of a job, so the per-listing pause is the cheapest thing to trim.
      LISTING_DELAY_SECONDS: ${LISTING_DELAY_SECONDS:-0.3}
      MAX_SCROLL_ATTEMPTS: ${MAX_SCROLL_ATTEMPTS:-3}
      ELEMENT_TIMEOUT_MS: ${ELEMENT_TIMEOUT_MS:-4000}

      # Email enrichment is the remaining ~22%; it is best-effort, so its
      # budgets are kept tight rather than letting slow sites dominate a job.
      EMAIL_MAX_CONCURRENCY: ${EMAIL_MAX_CONCURRENCY:-8}
      EMAIL_ENRICHMENT_TIMEOUT_SECONDS: ${EMAIL_ENRICHMENT_TIMEOUT_SECONDS:-15}
      EMAIL_ENRICHMENT_BATCH_TIMEOUT_SECONDS: ${EMAIL_ENRICHMENT_BATCH_TIMEOUT_SECONDS:-60}

      BROWSER_HEADLESS: "true"
      DISCOVERY_CONCURRENCY: ${DISCOVERY_CONCURRENCY:-1}
      BATCH_SIZE: ${BATCH_SIZE:-15}
      JOB_RETRY_LIMIT: ${JOB_RETRY_LIMIT:-3}
      DEFAULT_RADIUS_KM: ${DEFAULT_RADIUS_KM:-20.0}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: "production"

      # WhatsApp Meta API (read from .env, never hardcoded)
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-gmap_scraper_verify_token}

      # Template Studio. The agent writes copy, makes and checks photos with
      # Gemini. Model overrides are optional; the best available is picked.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}

      # Discovery tuning. These were in .env but never listed here, so the
      # container fell back to the code defaults and editing .env appeared to
      # do nothing.
      LOCATIONS_FILE: ${LOCATIONS_FILE:-Geocoded_Ad_Targeting_Locations_FINAL.xlsx}
      CATEGORIES_FILE: ${CATEGORIES_FILE:-G-Map Scraper Categories.xlsx}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-60000}
      SEARCH_DELAY_SECONDS: ${SEARCH_DELAY_SECONDS:-2}
      MAX_RESULTS_PER_JOB: ${MAX_RESULTS_PER_JOB:-200}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-600}
      STALE_JOB_AGE_MINUTES: ${STALE_JOB_AGE_MINUTES:-30}
      EMAIL_MAX_PAGES_PER_SITE: ${EMAIL_MAX_PAGES_PER_SITE:-5}
      EMAIL_NAVIGATION_TIMEOUT_MS: ${EMAIL_NAVIGATION_TIMEOUT_MS:-15000}

      # Sessions and approval emails. Without AUTH_JWT_SECRET the app signs
      # sessions with the database password, which works but ties the two
      # together. SMTP is optional: approvals still appear in the queue.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Google Sheets. GOOGLE_SHEET_ID names a sheet the user owns; the
      # service account only needs Editor access to it.
      GOOGLE_CREDENTIALS_BASE64: ${GOOGLE_CREDENTIALS_BASE64:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SHEET_OWNER_EMAIL: ${GOOGLE_SHEET_OWNER_EMAIL:-}

      # Campaign link tracking. PUBLIC_BASE_URL must be an address a phone can
      # reach over the internet, otherwise the tracking links will not open.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CAMPAIGN_LINK_TARGET_URL: ${CAMPAIGN_LINK_TARGET_URL:-https://kiosk.eko.in/signup?utm_source=AutoGMap}
      CAMPAIGN_LINK_FALLBACK_URL: ${CAMPAIGN_LINK_FALLBACK_URL:-https://kiosk.eko.in/signup?utm_source=AutoGMap}
      CAMPAIGN_LINK_HASH_SALT: ${CAMPAIGN_LINK_HASH_SALT:-gmap-campaign}
      # Tags added to the destination so analytics can attribute the visit.
      # utm_campaign is the campaign's own name and is not set here.
      CAMPAIGN_UTM_SOURCE: ${CAMPAIGN_UTM_SOURCE:-AutoGMap}
      CAMPAIGN_UTM_MEDIUM: ${CAMPAIGN_UTM_MEDIUM:-whatsapp}

      # Playwright browser path (must match Dockerfile ENV)
      PLAYWRIGHT_BROWSERS_PATH: /app/.playwright
    ports:
      # The reverse proxy is the only thing that should reach this.
      # BACKEND_HOST_PORT is chosen per server, never hardcoded.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Mount data files if you want to update them without rebuilding
      - ./data:/app/data
      - ./Geocoded_Ad_Targeting_Locations_FINAL.xlsx:/app/Geocoded_Ad_Targeting_Locations_FINAL.xlsx:ro
      - ./G-Map Scraper Categories.xlsx:/app/G-Map Scraper Categories.xlsx:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # n8n — workflow automation
  # Import the workflow from n8n/autonomous_google_maps_daily.json
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      BATCH_SIZE: ${BATCH_SIZE:-15}
      N8N_OUTPUT_SPREADSHEET_ID: ${N8N_OUTPUT_SPREADSHEET_ID:-}

      # n8n internal settings
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      GENERIC_TIMEZONE: "Asia/Kolkata"
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
